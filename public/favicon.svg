<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Top-Left (M): Coral / Red Gradient -->
    <linearGradient id="grad-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF453A" />
      <stop offset="100%" stop-color="#FF375F" />
    </linearGradient>

    <!-- Top-Right (P): Yellow / Lime Gradient -->
    <linearGradient id="grad-p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD60A" />
      <stop offset="100%" stop-color="#30D158" />
    </linearGradient>

    <!-- Bottom-Left (L): Magenta / Pink Gradient -->
    <linearGradient id="grad-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D55" />
      <stop offset="100%" stop-color="#BF5AF2" />
    </linearGradient>

    <!-- Bottom-Right (Y): Cyan / Blue Gradient -->
    <linearGradient id="grad-y" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64D2FF" />
      <stop offset="100%" stop-color="#0A84FF" />
    </linearGradient>
  </defs>

  <g transform="translate(1, 1)">
    <!-- Top-Left: M -->
    <rect x="1" y="1" width="28" height="28" rx="8" fill="url(#grad-m)" />
    <text x="15" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">M</text>

    <!-- Top-Right: P -->
    <rect x="33" y="1" width="28" height="28" rx="8" fill="url(#grad-p)" />
    <text x="47" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">P</text>

    <!-- Bottom-Left: L -->
    <rect x="1" y="33" width="28" height="28" rx="8" fill="url(#grad-l)" />
    <text x="15" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">L</text>

    <!-- Bottom-Right: Y -->
    <rect x="33" y="33" width="28" height="28" rx="8" fill="url(#grad-y)" />
    <text x="47" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">Y</text>
  </g>
</svg>